<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-labelledby="title desc">
  <title id="title">JetForce Studio logo</title>
  <desc id="desc">A cyan water jet meeting a vertical engineering plate with a force arrow.</desc>
  <defs>
    <linearGradient id="jet" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#07182c" stroke="#1e3a5f" stroke-width="2"/>
  <path d="M11 33h29" stroke="url(#jet)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M40 13v38" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/>
  <path d="M41 32c7-7 9-12 9-17M41 34c7 7 9 12 9 17" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 23l9 9-9 9" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="29" fill="#eaf5ff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="750" letter-spacing="-.4">JETFORCE</text>
  <text x="77" y="47" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650" letter-spacing="2.7">STUDIO</text>
</svg>
