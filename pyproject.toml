[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jetforce-studio"
version = "2.0.0"
description = "Interactive control-volume momentum analysis for a water jet striking a plate"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "MEC350 project team" }]
dependencies = [
  "streamlit==1.60.0",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "plotly==6.9.0",
  "matplotlib==3.11.1",
  "reportlab==4.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
  "black==26.5.1",
  "mypy==1.20.2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "error::RuntimeWarning",
  "error::numpy.exceptions.ComplexWarning",
]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = "/(\\.git|\\.venv|build|dist)/"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "exports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"app_pages/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
