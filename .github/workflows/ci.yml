name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 quality and startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Repair launcher permissions in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x run_local.sh run_macos.command
          git update-index --chmod=+x run_local.sh run_macos.command
          if git diff --cached --quiet; then
            echo "Launcher permissions already preserved."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve executable launcher permissions"
          git push origin HEAD:main

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install runtime and development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

      - name: Run mypy
        run: mypy src app.py app_pages

      - name: Check imports
        run: >-
          python -c "import app; import src; import src.calculations; import src.constants;
          import src.course; import src.models; import src.reporting; import src.traceability;
          import src.utils; import src.validation; import src.verification; import src.visualizations;
          print('Imports OK')"

      - name: Smoke-test headless Streamlit health
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --browser.gatherUsageStats=false \
            >streamlit-smoke.log 2>&1 &
          streamlit_pid=$!
          cleanup() {
            kill "$streamlit_pid" 2>/dev/null || true
            wait "$streamlit_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python - <<'PY'
          import sys
          import time
          import urllib.error
          import urllib.request

          health_url = "http://127.0.0.1:8501/_stcore/health"
          deadline = time.monotonic() + 30.0
          last_error = "server did not respond"
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(health_url, timeout=1.0) as response:
                      body = response.read().decode("utf-8", errors="replace").strip()
                      if response.status == 200 and body == "ok":
                          print(f"Streamlit health check passed: {response.status} {body}")
                          raise SystemExit(0)
                      last_error = f"unexpected response: {response.status} {body!r}"
              except (OSError, urllib.error.URLError) as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
              time.sleep(0.25)
          print(f"Streamlit health check failed: {last_error}", file=sys.stderr)
          raise SystemExit(1)
          PY

          python scripts/check_public_deployment.py http://127.0.0.1:8501/ --timeout 5

      - name: Build and verify clean release archive
        run: python scripts/build_release.py
